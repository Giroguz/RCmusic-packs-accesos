<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba de audio</title><body>
<h1>Prueba de reproducción</h1><audio id="a" controls preload="metadata" src="https://drive.google.com/uc?export=download&amp;confirm=t&amp;id=1p51LRAApozYpBMBntDAxqtOSP3aWmv8q"></audio><p id="result">Cargando</p>
<script>const a=document.getElementById('a'), r=document.getElementById('result'); ['loadedmetadata','canplay','playing','timeupdate','error','waiting','ended'].forEach(e=>a.addEventListener(e,()=>r.textContent=e+' tiempo='+a.currentTime.toFixed(1)+' duración='+a.duration+' error='+(a.error && a.error.code)));a.addEventListener('timeupdate',()=>{if(a.currentTime>=30){a.pause();a.currentTime=30;r.textContent='muestra finalizada: '+a.currentTime}});</script></body></html>
