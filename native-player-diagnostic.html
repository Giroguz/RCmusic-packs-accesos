<!doctype html><html><head><meta charset="utf-8"><title>Drive native audio diagnostic</title></head><body><h1>Audio native playback diagnostic</h1><audio id="a" controls preload="metadata" src="https://drive.google.com/uc?export=download&confirm=t&id=15YkrQbJt0D32QIGfkTDLeGcWYk7miAuR"></audio><pre id="log">waiting</pre><script>const a=document.querySelector('#a'),log=document.querySelector('#log');let ev=[];function show(e){ev.push(e+': '+a.currentTime.toFixed(2)+'s / '+(Number.isFinite(a.duration)?a.duration:'?'));log.textContent=ev.join('\n')}['loadstart','loadedmetadata','canplay','playing','pause','seeking','seeked','error','ended'].forEach(e=>a.addEventListener(e,()=>show(e)));setInterval(()=>{if(!a.paused&&a.currentTime>=110){a.pause();a.currentTime=110;show('LIMIT ENFORCED')}},200);</script></body></html>
